<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TNZ9WH3D"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Monitor (W Code)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            padding-top: 30px;
        }
        .container {
            background: #2d2d2d;
            padding: 20px 40px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h1 { color: #ffd700; margin-top: 0; }
        .price-display {
            font-size: 40px;
            font-weight: bold;
            color: #ffd700;
            margin: 15px 0;
        }
        .unit-selector {
            margin-bottom: 20px;
            background: #383838;
            padding: 10px;
            border-radius: 8px;
        }
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #444;
            color: white;
            cursor: pointer;
        }
        .grid-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .column {
            background: #383838;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .column h3 {
            margin-top: 0;
            text-align: center;
            color: #ddd;
        }
        .input-group {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input {
            padding: 8px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #444;
            color: white;
            width: 90px;
            margin-left: 10px;
        }
        .time-group {
            margin-top: 20px;
            padding: 15px;
            background: #383838;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .time-group input {
            width: 70px;
            text-align: center;
            margin-left: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffd700;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            width: 100%;
        }
        button:hover { background-color: #e6c200; }
        
        .status { 
            margin-top: 20px; 
            color: #aaa; 
            font-size: 14px; 
            line-height: 1.5;
        }
        .status-success {
            color: #4CAF50;
            font-weight: bold;
        }
        .beep-info {
            font-size: 13px;
            color: #ffd700;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gold Monitor Mizo</h1>
        
        <div class="price-display" id="price">Loading...</div>
        
        <!-- Unit Selector -->
        <div class="unit-selector">
            <label>Select Unit: </label>
            <select id="unitSelect" onchange="changeUnit()">
                <option value="ounce">1 Ounce (oz)</option>
                <option value="gram">1 Gram (g)</option>
                <option value="pound">8g Gold Pound (King George)</option>
            </select>
        </div>

        <div class="grid-container">
            <!-- Drop Alerts -->
            <div class="column">
                <h3>📉 Drop Alerts</h3>
                <div class="input-group">
                    <label>Target 1:</label>
                    <input type="number" id="drop1" placeholder="Target" step="0.01">
                </div>
                <div class="input-group">
                    <label>Target 2:</label>
                    <input type="number" id="drop2" placeholder="Target" step="0.01">
                </div>
                <div class="input-group">
                    <label>Target 3:</label>
                    <input type="number" id="drop3" placeholder="Target" step="0.01">
                </div>
            </div>

            <!-- Roof Alerts -->
            <div class="column">
                <h3>📈 Roof Alerts</h3>
                <div class="input-group">
                    <label>Target 1:</label>
                    <input type="number" id="roof1" placeholder="Target" step="0.01">
                </div>
                <div class="input-group">
                    <label>Target 2:</label>
                    <input type="number" id="roof2" placeholder="Target" step="0.01">
                </div>
                <div class="input-group">
                    <label>Target 3:</label>
                    <input type="number" id="roof3" placeholder="Target" step="0.01">
                </div>
            </div>
        </div>

        <!-- Check Time Setting -->
        <div class="time-group">
            <label>Check price every:</label>
            <input type="number" id="checkTime" value="20" min="5" step="1">
            <span>seconds</span>
        </div>

        <button onclick="enableAlerts()">Enable Desktop Alerts</button>
        
        <div class="status" id="status">
            Waiting for you to enable alerts...<br>
            <span class="beep-info">Sound Guide: 📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
        </div>
    </div>

    <script>
        let notificationsAllowed = false;
        let intervalId = null;
        
        let currentUnit = "ounce"; 
        let currentUnitText = "USD/oz";
        
        const GRAMS_PER_OUNCE = 31.1035;

        let triggeredAlerts = {
            drop1: false, drop2: false, drop3: false,
            roof1: false, roof2: false, roof3: false
        };

        const targetIds = ["drop1", "drop2", "drop3", "roof1", "roof2", "roof3"];

        // --- 0. LOAD SAVED NUMBERS, TIME, AND UNIT ---
        window.onload = function() {
            const savedTime = localStorage.getItem("gold_checkTime");
            if (savedTime !== null) {
                document.getElementById("checkTime").value = savedTime;
            }

            const savedUnit = localStorage.getItem("gold_unit");
            if (savedUnit) {
                document.getElementById("unitSelect").value = savedUnit;
            } else {
                document.getElementById("unitSelect").value = "ounce";
            }
            
            updateUnitAndTargets(false); 
            startMonitoring();
        };

        // --- SAVE NUMBERS WHEN YOU TYPE ---
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("checkTime").addEventListener("input", (e) => {
                localStorage.setItem("gold_checkTime", e.target.value);
                startMonitoring();
            });

            targetIds.forEach(id => {
                document.getElementById(id).addEventListener("input", (e) => {
                    localStorage.setItem(`gold_${currentUnit}_${id}`, e.target.value);
                });
            });
        });

        // --- Update Unit & Load Targets ---
        function changeUnit(triggerUpdate = true) {
            updateUnitAndTargets(triggerUpdate);
        }

        function updateUnitAndTargets(triggerUpdate = true) {
            currentUnit = document.getElementById("unitSelect").value;
            localStorage.setItem("gold_unit", currentUnit);
            
            if (currentUnit === "gram") currentUnitText = "USD/g";
            else if (currentUnit === "ounce") currentUnitText = "USD/oz";
            else if (currentUnit === "pound") currentUnitText = "USD/coin";

            targetIds.forEach(id => {
                const savedVal = localStorage.getItem(`gold_${currentUnit}_${id}`);
                document.getElementById(id).value = savedVal !== null ? savedVal : "";
                triggeredAlerts[id] = false; 
            });

            if (triggerUpdate) {
                updatePrice(); 
            }
        }

        // --- Audio Setup ---
        let audioCtx;
        function playBeeps(numBeeps) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            let time = audioCtx.currentTime;
            for (let i = 0; i < numBeeps; i++) {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(880, time); 
                
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.5, time + 0.05);
                gain.gain.linearRampToValueAtTime(0, time + 0.2);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(time);
                osc.stop(time + 0.25);
                time += 0.35; 
            }
        }

        // --- 1. Enable Alerts & Audio ---
        function enableAlerts() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            audioCtx.resume();

            if (!("Notification" in window)) {
                alert("This browser does not support desktop notifications.");
                return;
            }
            
            Notification.requestPermission().then(function (permission) {
                if (permission === "granted") {
                    notificationsAllowed = true;
                    document.getElementById("status").innerHTML = `
                        <span class="status-success">✅ Monitoring active.</span><br>
                        <span class="beep-info">📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
                    `;
                    new Notification("Gold Monitor (W Code)", { body: "You will now receive alerts here." });
                } else {
                    document.getElementById("status").innerText = "Alerts blocked. Please allow notifications in your browser.";
                }
            });
        }

        // --- 2. Fetch and Calculate Gold Price ---
        async function fetchGoldPrice() {
            try {
                const response = await fetch("https://xaus.com/api/v1/spot?unit=gram&compact=1");
                const data = await response.json();
                if (data.data_state && data.data_state.status === "fresh") {
                    let priceInGrams = parseFloat(data.xau.price);
                    
                    if (currentUnit === "gram") {
                        return priceInGrams;
                    } else if (currentUnit === "ounce") {
                        return priceInGrams * GRAMS_PER_OUNCE;
                    } else if (currentUnit === "pound") {
                        // YOUR FORMULA: 20 + (7 * price per gram)
                        return 20 + (7 * priceInGrams);
                    }
                }
                return null;
            } catch (error) {
                return null;
            }
        }

        // --- 3. The Main Loop Setup ---
        function startMonitoring() {
            if (intervalId) clearInterval(intervalId);

            let seconds = parseFloat(document.getElementById("checkTime").value);
            if (isNaN(seconds) || seconds < 5) seconds = 20;

            if (!notificationsAllowed) {
                document.getElementById("status").innerHTML = `
                    Waiting for you to enable alerts...<br>
                    <span class="beep-info">Sound Guide: 📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
                `;
            } else {
                document.getElementById("status").innerHTML = `
                    <span class="status-success">✅ Monitoring active (Every ${seconds}s).</span><br>
                    <span class="beep-info">📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
                `;
            }

            updatePrice();
            intervalId = setInterval(updatePrice, seconds * 1000);
        }

        async function updatePrice() {
            const price = await fetchGoldPrice();
            
            if (price !== null) {
                document.getElementById("price").innerText = price.toFixed(2) + " " + currentUnitText;
                checkThresholds(price);
            } else {
                document.getElementById("status").innerText = "Connection error. Retrying...";
            }
        }

        // --- 4. Check All 6 Targets ---
        function checkThresholds(price) {
            const targets = [
                { id: "drop1", type: "drop" },
                { id: "drop2", type: "drop" },
                { id: "drop3", type: "drop" },
                { id: "roof1", type: "roof" },
                { id: "roof2", type: "roof" },
                { id: "roof3", type: "roof" }
            ];

            targets.forEach(target => {
                const val = parseFloat(document.getElementById(target.id).value);
                
                if (!isNaN(val)) {
                    if (target.type === "drop") {
                        if (price <= val && !triggeredAlerts[target.id]) {
                            playBeeps(1);
                            triggerAlert(`📉 DROP ALERT: Price is under ${val} ${currentUnitText}!\nCurrent: ${price.toFixed(2)}`);
                            triggeredAlerts[target.id] = true;
                        } 
                        else if (price > val + 0.10 && triggeredAlerts[target.id]) {
                            triggeredAlerts[target.id] = false;
                        }
                    } 
                    else if (target.type === "roof") {
                        if (price >= val && !triggeredAlerts[target.id]) {
                            playBeeps(2);
                            triggerAlert(`📈 ROOF ALERT: Price is over ${val} ${currentUnitText}!\nCurrent: ${price.toFixed(2)}`);
                            triggeredAlerts[target.id] = true;
                        }
                        else if (price < val - 0.10 && triggeredAlerts[target.id]) {
                            triggeredAlerts[target.id] = false;
                        }
                    }
                }
            });
        }

        // --- 5. Trigger the Popup ---
        function triggerAlert(message) {
            if (notificationsAllowed) {
                new Notification("Gold Alert (W Code)", {
                    body: message
                });
            } else {
                alert(message);
            }
        }
    </script>
</body>
</html>
