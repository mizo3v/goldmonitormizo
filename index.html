<!DOCTYPE html>
<html lang="en">
<head>

<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TNZ9WH3D"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Monitor (W Code)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
            text-align: center;
            padding-top: 10px;
            padding-bottom: 20px;
            margin: 0;
        }
        .container {
            background: #2d2d2d;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            width: 95%;
            max-width: 650px;
        }
        h1 { color: #ffd700; margin-top: 0; font-size: 22px; margin-bottom: 10px; }
        .price-display {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .unit-selector {
            background: #383838;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
        }
        .timeframe-selector {
            background: #383838;
            padding: 8px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            gap: 5px;
        }
        .timeframe-selector button {
            background: #444;
            color: white;
            border: 1px solid #555;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 0;
            width: auto;
        }
        .timeframe-selector button.active {
            background: #ffd700;
            color: black;
            font-weight: bold;
            border-color: #ffd700;
        }
        select {
            padding: 6px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #444;
            color: white;
            cursor: pointer;
        }
        .chart-container {
            background: #222;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            height: 180px; 
            width: 100%;
            box-sizing: border-box;
        }
        .grid-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .column {
            background: #383838;
            padding: 10px 15px;
            border-radius: 8px;
            text-align: left;
            flex: 1;
        }
        .column h3 {
            margin-top: 0;
            text-align: center;
            color: #ddd;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .input-group {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        input {
            padding: 5px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #444;
            color: white;
            width: 75px;
            margin-left: 10px;
        }
        .time-group {
            margin-top: 15px;
            padding: 10px;
            background: #383838;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .time-group input {
            width: 60px;
            text-align: center;
            margin-left: 0;
        }
        .main-btn {
            padding: 8px 15px;
            font-size: 14px;
            background-color: #ffd700;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            transition: 0.3s;
        }
        .main-btn:hover { background-color: #e6c200; }
        .status { 
            margin-top: 12px; 
            color: #aaa; 
            font-size: 12px; 
            line-height: 1.4;
        }
        .status-success { color: #4CAF50; font-weight: bold; }
        .beep-info { font-size: 11px; color: #ffd700; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gold Monitor Mizo</h1>
        <div class="price-display" id="price">Loading...</div>
        
        <div class="controls-row">
            <div class="unit-selector">
                <label>Unit: </label>
                <select id="unitSelect" onchange="changeUnit()">
                    <option value="ounce">1 Ounce (oz)</option>
                    <option value="gram">1 Gram (g)</option>
                    <option value="pound">8g Gold Pound</option>
                </select>
            </div>
            
            <div class="timeframe-selector">
                <button id="btn-1h" class="active" onclick="changeTimeframe('1h')">1H</button>
                <button id="btn-24h" onclick="changeTimeframe('24h')">24H</button>
                <button id="btn-1m" onclick="changeTimeframe('1m')">1M</button>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="goldChart"></canvas>
        </div>

        <div class="grid-container">
            <div class="column">
                <h3>📉 Drop Alerts</h3>
                <div class="input-group"><label>Target 1:</label><input type="number" id="drop1" placeholder="Target" step="0.01"></div>
                <div class="input-group"><label>Target 2:</label><input type="number" id="drop2" placeholder="Target" step="0.01"></div>
                <div class="input-group"><label>Target 3:</label><input type="number" id="drop3" placeholder="Target" step="0.01"></div>
            </div>
            <div class="column">
                <h3>📈 Roof Alerts</h3>
                <div class="input-group"><label>Target 1:</label><input type="number" id="roof1" placeholder="Target" step="0.01"></div>
                <div class="input-group"><label>Target 2:</label><input type="number" id="roof2" placeholder="Target" step="0.01"></div>
                <div class="input-group"><label>Target 3:</label><input type="number" id="roof3" placeholder="Target" step="0.01"></div>
            </div>
        </div>

        <div class="time-group">
            <label>Check every:</label>
            <input type="number" id="checkTime" value="20" min="5" step="1">
            <span>seconds</span>
        </div>

        <button class="main-btn" id="enableBtn" onclick="enableAlerts()">Click to Activate (Required for sound)</button>
        
        <div class="status" id="status">
            Waiting for you to enable alerts...<br>
            <span class="beep-info">📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
        </div>
    </div>

    <script>
        let notificationsAllowed = false;
        let intervalId = null;
        
        let currentUnit = "ounce"; 
        let currentUnitText = "USD/oz";
        let currentTimeframe = "1h";
        
        const GRAMS_PER_OUNCE = 31.1035;
        
        let goldChart;
        const chartLabels = [];
        const chartData = [];

        let triggeredAlerts = { drop1: false, drop2: false, drop3: false, roof1: false, roof2: false, roof3: false };
        const targetIds = ["drop1", "drop2", "drop3", "roof1", "roof2", "roof3"];

        // --- AUDIO UNLOCK FUNCTION ---
        let audioCtx;
        function unlockAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Unlock audio on the very first click anywhere on the page
        document.addEventListener('click', unlockAudio, { once: true });

        function initChart() {
            const ctx = document.getElementById('goldChart').getContext('2d');
            goldChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Gold Price',
                        data: chartData,
                        borderColor: '#ffd700',
                        backgroundColor: 'rgba(255, 215, 0, 0.1)',
                        borderWidth: 1.5,
                        pointRadius: 0, 
                        fill: true,
                        tension: 0.2 
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            display: true, 
                            grid: { display: false, drawBorder: false },
                            ticks: { color: '#aaa', font: { size: 9 }, maxTicksLimit: 6 }
                        },
                        y: {
                            grid: { color: '#444', drawBorder: false },
                            ticks: { color: '#aaa', font: { size: 10 } }
                        }
                    },
                    animation: false 
                }
            });
        }

        async function loadHistory() {
            chartLabels.length = 0;
            chartData.length = 0;
            
            let interval = "1m"; 
            let limit = 60; 

            if (currentTimeframe === "1h") {
                interval = "1m"; limit = 60;
            } else if (currentTimeframe === "24h") {
                interval = "15m"; limit = 96; 
            } else if (currentTimeframe === "1m") {
                interval = "4h"; limit = 180; 
            }

            try {
                const url = `https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${interval}&limit=${limit}`;
                const response = await fetch(url);
                const data = await response.json();

                let dataLength = data.length;
                if (currentTimeframe === "1h" && dataLength > 2) {
                    dataLength -= 2; 
                }

                for (let i = 0; i < dataLength; i++) {
                    let timestamp = data[i][0];
                    let closePrice = parseFloat(data[i][4]); 

                    let date = new Date(timestamp);
                    let timeStr;
                    
                    if (currentTimeframe === "1m") {
                        timeStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
                    } else {
                        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }

                    let convertedPrice = convertPrice(closePrice, "ounce");
                    chartLabels.push(timeStr);
                    chartData.push(convertedPrice);
                }
                
                if (goldChart) goldChart.update();

            } catch (e) {
                console.log("Could not load history:", e);
            }
        }

        function convertPrice(priceInOz, fromUnit) {
            let priceInGrams = priceInOz / GRAMS_PER_OUNCE;
            if (currentUnit === "gram") return priceInGrams;
            else if (currentUnit === "ounce") return priceInOz;
            else if (currentUnit === "pound") return 20 + (7 * priceInGrams);
            return priceInOz;
        }

        window.onload = function() {
            initChart(); 

            const savedTime = localStorage.getItem("gold_checkTime");
            if (savedTime !== null) document.getElementById("checkTime").value = savedTime;

            const savedUnit = localStorage.getItem("gold_unit");
            if (savedUnit) document.getElementById("unitSelect").value = savedUnit;
            else document.getElementById("unitSelect").value = "ounce";
            
            updateUnitAndTargets(false); 

            // --- CHECK SAVED ACTIVATION STATE ---
            if (localStorage.getItem("gold_activated") === "true") {
                notificationsAllowed = true;
                document.getElementById("enableBtn").innerText = "✅ Activated (Click page to unlock sound)";
                document.getElementById("enableBtn").style.backgroundColor = "#4CAF50";
                document.getElementById("enableBtn").style.color = "white";
                document.getElementById("status").innerHTML = `
                    <span class="status-success">✅ Monitoring active.</span><br>
                    <span class="beep-info">📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
                `;
            }
            
            loadHistory().then(() => {
                startMonitoring();
            });
        };

        function changeTimeframe(tf) {
            currentTimeframe = tf;
            
            document.getElementById('btn-1h').classList.remove('active');
            document.getElementById('btn-24h').classList.remove('active');
            document.getElementById('btn-1m').classList.remove('active');
            document.getElementById(`btn-${tf}`).classList.add('active');

            loadHistory().then(() => updatePrice());
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("checkTime").addEventListener("input", (e) => {
                localStorage.setItem("gold_checkTime", e.target.value);
                startMonitoring();
            });

            targetIds.forEach(id => {
                document.getElementById(id).addEventListener("input", (e) => {
                    localStorage.setItem(`gold_${currentUnit}_${id}`, e.target.value);
                });
            });
        });

        function changeUnit() {
            updateUnitAndTargets(true);
        }

        function updateUnitAndTargets(triggerUpdate = true) {
            currentUnit = document.getElementById("unitSelect").value;
            localStorage.setItem("gold_unit", currentUnit);
            
            if (currentUnit === "gram") currentUnitText = "USD/g";
            else if (currentUnit === "ounce") currentUnitText = "USD/oz";
            else if (currentUnit === "pound") currentUnitText = "USD/coin";

            targetIds.forEach(id => {
                const savedVal = localStorage.getItem(`gold_${currentUnit}_${id}`);
                document.getElementById(id).value = savedVal !== null ? savedVal : "";
                triggeredAlerts[id] = false; 
            });

            if (triggerUpdate) {
                loadHistory().then(() => updatePrice());
            }
        }

        function playBeeps(numBeeps) {
            unlockAudio(); // Ensure audio is awake
            if (!audioCtx) return;

            let time = audioCtx.currentTime;
            for (let i = 0; i < numBeeps; i++) {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(880, time); 
                
                gain.gain.setValueAtTime(0, time);
                gain.gain.linearRampToValueAtTime(0.6, time + 0.05); 
                gain.gain.setValueAtTime(0.6, time + 0.7);           
                gain.gain.linearRampToValueAtTime(0, time + 0.8);    
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(time);
                osc.stop(time + 0.8); 
                
                time += 0.9; 
            }
        }

        function enableAlerts() {
            unlockAudio();

            // Save the choice to the browser's memory
            localStorage.setItem("gold_activated", "true");
            notificationsAllowed = true;

            document.getElementById("enableBtn").innerText = "✅ Activated!";
            document.getElementById("enableBtn").style.backgroundColor = "#4CAF50";
            document.getElementById("enableBtn").style.color = "white";
            document.getElementById("status").innerHTML = `
                <span class="status-success">✅ Monitoring active.</span><br>
                <span class="beep-info">📉 Drop = 1 Beep | 📈 Roof = 2 Beeps</span>
            `;

            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        async function fetchLiveGoldPrice() {
            try {
                const response = await fetch("https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT");
                const data = await response.json();
                let priceInOz = parseFloat(data.price);
                return convertPrice(priceInOz, "ounce");
            } catch (error) { return null; }
        }

        function startMonitoring() {
            if (intervalId) clearInterval(intervalId);
            let seconds = parseFloat(document.getElementById("checkTime").value);
            if (isNaN(seconds) || seconds < 5) seconds = 20;

            updatePrice();
            intervalId = setInterval(updatePrice, seconds * 1000);
        }

        async function updatePrice() {
            const price = await fetchLiveGoldPrice();
            
            if (price !== null) {
                document.getElementById("price").innerText = price.toFixed(2) + " " + currentUnitText;
                
                if (currentTimeframe === "1h") {
                    let timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    chartLabels.push(timeStr);
                    chartData.push(price);

                    if (chartLabels.length > 120) { 
                        chartLabels.shift();
                        chartData.shift();
                    }
                    if (goldChart) goldChart.update();
                }

                checkThresholds(price);
            } else {
                document.getElementById("status").innerText = "Connection error. Retrying...";
            }
        }

        function checkThresholds(price) {
            if (!notificationsAllowed) return; 

            const targets = [
                { id: "drop1", type: "drop" }, { id: "drop2", type: "drop" }, { id: "drop3", type: "drop" },
                { id: "roof1", type: "roof" }, { id: "roof2", type: "roof" }, { id: "roof3", type: "roof" }
            ];

            targets.forEach(target => {
                const val = parseFloat(document.getElementById(target.id).value);
                if (!isNaN(val)) {
                    if (target.type === "drop") {
                        if (price <= val && !triggeredAlerts[target.id]) {
                            playBeeps(1);
                            triggerAlert(`📉 DROP ALERT: Price is under ${val} ${currentUnitText}!\nCurrent: ${price.toFixed(2)}`);
                            triggeredAlerts[target.id] = true;
                        } 
                        else if (price > val + 0.10 && triggeredAlerts[target.id]) {
                            triggeredAlerts[target.id] = false;
                        }
                    } 
                    else if (target.type === "roof") {
                        if (price >= val && !triggeredAlerts[target.id]) {
                            playBeeps(2);
                            triggerAlert(`📈 ROOF ALERT: Price is over ${val} ${currentUnitText}!\nCurrent: ${price.toFixed(2)}`);
                            triggeredAlerts[target.id] = true;
                        }
                        else if (price < val - 0.10 && triggeredAlerts[target.id]) {
                            triggeredAlerts[target.id] = false;
                        }
                    }
                }
            });
        }

        function triggerAlert(message) {
            if (notificationsAllowed && "Notification" in window && Notification.permission === "granted") {
                new Notification("Gold Alert (W Code)", { body: message });
            } else {
                alert(message);
            }
        }
    </script>
</body>
</html>
