<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Monitor — Public View</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Arial, sans-serif;
    background: #121212;
    color: #e6edf3;
    padding: 24px;
    max-width: 1100px;
    margin: auto;
  }
  h1 { font-size: 20px; color: #ffd700; margin: 0 0 6px; }
  h2 { font-size: 14px; color: #8b949e; text-transform: uppercase;
       letter-spacing: .5px; margin: 28px 0 12px; }
  .meta { font-size: 12px; color: #8b949e; margin-bottom: 10px; }
  .btn {
    background: #1d4ed8; border: none; padding: 8px 16px; border-radius: 6px;
    color: #fff; cursor: pointer; font-size: 13px; margin-bottom: 18px;
  }
  .btn:hover { background: #2563eb; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px;
  }
  .card {
    background: #1e1e1e; border: 1px solid #333; border-radius: 10px;
    padding: 14px; text-align: center;
  }
  .card h3 {
    margin: 0 0 8px; font-size: 12px; color: #8b949e;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .val { font-size: 22px; font-weight: 700; color: #eab308; }
  .up { color: #3fb950; }
  .down { color: #f85149; }

  .imgs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .imgs img {
    width: 100%; border-radius: 10px; border: 1px solid #333;
    display: block; background: #1a1a1a;
  }

  .error {
    background: #2a1a1a; border: 1px solid #f85149; color: #f85149;
    padding: 12px 16px; border-radius: 8px; font-size: 13px;
    line-height: 1.5; margin: 12px 0;
  }
  .error code {
    background: #3a1a1a; padding: 2px 6px; border-radius: 4px;
    font-size: 12px; word-break: break-all;
  }
</style>
</head>
<body>

<h1>🥇 Gold Monitor — Public View</h1>
<div class="meta" id="stamp">Loading snapshot…</div>
<button class="btn" onclick="load()">🔄 Reload</button>

<div id="errorBox"></div>

<div class="cards" id="cards"></div>

<h2>Charts</h2>
<div class="imgs" id="imgs"></div>

<script>
// ============================================================
// EDIT THESE TWO LINES ONLY
// ============================================================
const OWNER  = 'your-github-username';   // ← exact case
const REPO   = 'your-repo-name';         // ← exact case
const BRANCH = 'main';                   // 'main' or 'master'
// ============================================================

const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;

const stampEl  = document.getElementById('stamp');
const cardsEl  = document.getElementById('cards');
const imgsEl   = document.getElementById('imgs');
const errorEl  = document.getElementById('errorBox');

function showError(msg) {
  errorEl.innerHTML = `<div class="error">${msg}</div>`;
  stampEl.textContent = '⚠️ Could not load snapshot.';
  cardsEl.innerHTML = '';
}

function cls(v) {
  return v >= 55 ? 'up' : v <= 45 ? 'down' : '';
}

async function load() {
  errorEl.innerHTML = '';
  stampEl.textContent = 'Loading…';

  const url = `${RAW}/dashboard_data.json?t=${Date.now()}`;
  console.log('[viewer] fetching', url);

  let res;
  try {
    res = await fetch(url, { cache: 'no-store' });
  } catch (e) {
    return showError(`Network error: ${e.message}.<br>URL: <code>${url}</code>`);
  }

  console.log('[viewer] HTTP', res.status, res.url);

  if (!res.ok) {
    return showError(
      `HTTP ${res.status} — file not found.<br>` +
      `URL: <code>${url}</code><br>` +
      `Check: OWNER / REPO names (case-sensitive), branch is <code>${BRANCH}</code>, and repo is public.`
    );
  }

  const text = await res.text();
  console.log('[viewer] first 120 chars:', text.slice(0, 120));

  if (text.trim().startsWith('<')) {
    return showError(
      `Server returned HTML, not JSON.<br>` +
      `You probably opened the viewer from <code>raw.githubusercontent.com</code> ` +
      `or <code>github.com/.../blob/...</code>. Use your GitHub Pages URL instead.`
    );
  }

  let d;
  try {
    d = JSON.parse(text);
  } catch (e) {
    return showError(
      `Invalid JSON: ${e.message}<br>` +
      `First 80 chars of response: <code>${text.slice(0, 80)}</code>`
    );
  }

  // ---------- Render success ----------
  stampEl.textContent =
    `Snapshot: ${new Date(d.timestamp).toLocaleString()} · ` +
    `Unit: ${d.selectedUnit} · Model: ${d.activeModel}`;

  const s = d.modelScores || {};
  const price = Number(d.currentPrice || 0).toFixed(2);

  cardsEl.innerHTML = `
    <div class="card"><h3>Price</h3><div class="val">$${price}</div></div>
    <div class="card"><h3>Daily</h3><div class="val ${cls(s.Daily)}">${Number(s.Daily || 0).toFixed(1)}%</div></div>
    <div class="card"><h3>Weekly</h3><div class="val ${cls(s.Weekly)}">${Number(s.Weekly || 0).toFixed(1)}%</div></div>
    <div class="card"><h3>Monthly</h3><div class="val ${cls(s.Monthly)}">${Number(s.Monthly || 0).toFixed(1)}%</div></div>
    <div class="card"><h3>Long-term</h3><div class="val ${cls(s.LongTerm)}">${Number(s.LongTerm || 0).toFixed(1)}%</div></div>
  `;

  const t = Date.now();
  imgsEl.innerHTML = ['chart2', 'chart3', 'chart6']
    .map(name => `
      <div>
        <img src="${RAW}/${name}.png?t=${t}" alt="${name}"
             onerror="this.style.opacity=0.25; this.alt='${name}.png not found';">
      </div>
    `)
    .join('');
}

load();
setInterval(load, 60_000);   // auto-refresh every minute
</script>
</body>
</html>
